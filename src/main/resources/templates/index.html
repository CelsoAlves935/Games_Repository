<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>
        Minha Estante de Jogos
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>🎮 Minha Biblioteca</h1>
            <a th:href="@{/novo}" class="btn btn-primary">Novo Jogo</a>
        </div>

        <div class="card mb-4 border-0 shadow-sm bg-dark text-white">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <h5 class="mb-0">Sua Estante</h5>
                        <p class="text-muted mb-0">
                            Você tem <span class="text-white fw-bold" th:text="${totalJogos}">0</span> jogos, <span
                                class="text-success fw-bold" th:text="${totalZerados}">0</span> zerados e <span
                                class="text-info fw-bold" th:text="${totalPlatinados}">0</span> platinados.
                        </p>
                    </div>
                    <div class="col-md-8">
                        <div class="d-flex justify-content-between mb-1">
                            <span>Progresso da Platina 🏆</span>
                            <span th:text="${porcentagem} + '%'">0%</span>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar progress-bar-platinum progress-bar-striped progress-bar-animated"
                                role="progressbar" th:style="'--target-width: ' + ${porcentagem} + '%;'"
                                th:aria-valuenow="${porcentagem}" aria-valuemin="0" aria-valuemax="100">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtros e Busca -->
        <div class="row mb-4">
            <div class="col-md-6 mb-2">
                <input type="text" id="searchInput" class="form-control bg-dark text-white border-secondary" placeholder="🔍 Buscar jogo por título ou plataforma...">
            </div>
            <div class="col-md-6 mb-2 d-flex gap-2 flex-wrap">
                <button class="btn btn-outline-primary filter-btn active" data-filter="all">Todos</button>
                <button class="btn btn-outline-info filter-btn" data-filter="platinado">Platinados 🏆</button>
                <button class="btn btn-outline-success filter-btn" data-filter="zerado">Apenas Zerados ✅</button>
                <button class="btn btn-outline-warning filter-btn" data-filter="jogando">Jogando 🕹️</button>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4" id="gameGrid">

            <div class="col game-card-col" th:each="game : ${jogos}">
                <div class="card h-100 shadow-sm border-0 game-card game-card-button"
                    th:data-titulo="${game.titulo}"
                    th:data-plataforma="${game.plataforma}"
                    th:data-genero="${game.genero}"
                    th:data-zerado="${game.zerado}"
                    th:data-platinado="${game.platinado}"
                    th:data-url="${game.urlCapa}"
                    th:data-notazerado="${game.notaZerado}"
                    th:data-opiniaozerado="${game.opiniaoZerado}"
                    th:data-notaplatina="${game.notaPlatina}"
                    th:data-opiniaoplatina="${game.opiniaoPlatina}">
                    
                    <!-- Imagem da capa com container relativo para as tags -->
                    <div class="position-relative">
                        <img th:if="${game.urlCapa != null and !game.urlCapa.isEmpty()}" th:src="${game.urlCapa}" class="card-img-top game-cover" alt="Capa do Jogo">
                        <div th:unless="${game.urlCapa != null and !game.urlCapa.isEmpty()}" class="card-img-top game-cover-placeholder d-flex align-items-center justify-content-center bg-secondary text-white">
                            <span style="font-size: 3rem;">🎮</span>
                        </div>

                        <!-- Tag de Platina no canto superior direito -->
                        <div th:if="${game.platinado}" class="position-absolute top-0 end-0 p-2">
                            <img src="/img/platina.png" alt="Platina" class="platina-badge-overlay" title="Platinado!">
                        </div>
                        
                        <!-- Tag de Zerado (somente se não for platinado) -->
                        <div th:if="${game.zerado and !game.platinado}" class="position-absolute top-0 end-0 p-2">
                            <span class="badge bg-success shadow-sm" style="font-size: 0.9rem;">Zerado ✅</span>
                        </div>
                    </div>

                    <div class="card-body d-flex flex-column" th:classappend="${game.zerado} ? 'border-success-top' : 'border-warning-top'">
                        <h5 class="card-title fw-bold" th:text="${game.titulo}">Título</h5>
                        <p class="card-text text-muted mb-2">
                            <small th:text="${game.plataforma}">Plataforma</small>
                        </p>

                        <div class="mt-auto">
                            <span class="badge rounded-pill"
                                th:classappend="${game.zerado} ? 'bg-success' : 'bg-warning text-dark'"
                                th:text="${game.zerado ? 'Zerado ✅' : 'Jogando 🕹️'}">
                            </span>
                            <span th:if="${game.platinado}" class="badge rounded-pill bg-info text-dark ms-1">
                                Platinado 🏆
                            </span>
                        </div>
                    </div>

                    <div class="card-footer bg-transparent border-0 pb-3">
                        <div class="btn-group w-100">
                            <a th:href="@{/editar/{id}(id=${game.id})}"
                                class="btn btn-outline-secondary btn-sm">Editar</a>
                            <a th:href="@{/excluir/{id}(id=${game.id})}" class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('Tem certeza que deseja apagar este jogo?')">
                                Excluir
                            </a>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal de Detalhes do Jogo -->
    <div class="modal fade text-dark" id="gameModal" tabindex="-1" aria-labelledby="gameModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title fw-bold" id="gameModalLabel">Detalhes do Jogo</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0">
             <img id="modalCover" src="" class="img-fluid w-100 mb-3" style="max-height: 300px; object-fit: cover; display: none;">
             <div class="p-3">
                 <h3 id="modalTitle" class="fw-bold mb-1">Titulo</h3>
                 <p class="text-muted mb-4"><span id="modalPlataforma">Plataforma</span> • <span id="modalGenero">Genero</span></p>

                 <div id="modalZeradoSection" class="mb-3" style="display: none;">
                     <hr class="border-secondary">
                     <h5 class="text-success fw-bold">Jornada Principal ✅ <span id="notaZeradoBadge" class="badge bg-success ms-2">Nota: 10/10</span></h5>
                     <p id="modalOpiniaoZerado" class="bg-secondary bg-opacity-25 p-3 rounded fst-italic mt-2"></p>
                 </div>

                 <div id="modalPlatinaSection" class="mb-3" style="display: none;">
                     <hr class="border-secondary">
                     <h5 class="text-info fw-bold">Busca pela Platina 🏆 <span id="notaPlatinaBadge" class="badge bg-info text-dark ms-2">Nota: 10/10</span></h5>
                     <p id="modalOpiniaoPlatina" class="bg-secondary bg-opacity-25 p-3 rounded fst-italic mt-2"></p>
                 </div>
             </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS para o Modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('searchInput');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const gameCards = document.querySelectorAll('.game-card-col');
            const gameModalElement = document.getElementById('gameModal');
            const gameModal = new bootstrap.Modal(gameModalElement);

            function filterGames() {
                const searchTerm = searchInput.value.toLowerCase();
                const activeFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');

                gameCards.forEach(card => {
                    const gameCard = card.querySelector('.game-card');
                    const titulo = (gameCard.getAttribute('data-titulo') || '').toLowerCase();
                    const plataforma = (gameCard.getAttribute('data-plataforma') || '').toLowerCase();
                    const isZerado = gameCard.getAttribute('data-zerado') === 'true';
                    const isPlatinado = gameCard.getAttribute('data-platinado') === 'true';

                    const matchesSearch = titulo.includes(searchTerm) || plataforma.includes(searchTerm);
                    
                    let matchesFilter = false;
                    if (activeFilter === 'all') matchesFilter = true;
                    if (activeFilter === 'platinado' && isPlatinado) matchesFilter = true;
                    if (activeFilter === 'zerado' && isZerado && !isPlatinado) matchesFilter = true;
                    if (activeFilter === 'jogando' && !isZerado) matchesFilter = true;

                    if (matchesSearch && matchesFilter) {
                        card.style.display = '';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            if (searchInput) searchInput.addEventListener('input', filterGames);

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function () {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    filterGames();
                });
            });

            // Lógica para abrir o Modal de review
            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', function (e) {
                    // Não abrir o modal se clicar nos botões de Editar/Excluir
                    if(e.target.closest('.btn-group')) return;

                    const titulo = this.getAttribute('data-titulo');
                    const plataforma = this.getAttribute('data-plataforma');
                    const genero = this.getAttribute('data-genero');
                    const url = this.getAttribute('data-url');
                    
                    const isZerado = this.getAttribute('data-zerado') === 'true';
                    const notaZ = this.getAttribute('data-notazerado');
                    const opiniaoZ = this.getAttribute('data-opiniaozerado');
                    
                    const isPlatinado = this.getAttribute('data-platinado') === 'true';
                    const notaP = this.getAttribute('data-notaplatina');
                    const opiniaoP = this.getAttribute('data-opiniaoplatina');

                    // Preencher infos básicas
                    document.getElementById('modalTitle').textContent = titulo;
                    document.getElementById('modalPlataforma').textContent = plataforma;
                    document.getElementById('modalGenero').textContent = genero;

                    const coverEl = document.getElementById('modalCover');
                    if(url && url.trim() !== '') {
                        coverEl.src = url;
                        coverEl.style.display = 'block';
                    } else {
                        coverEl.style.display = 'none';
                    }

                    // Seções de Review
                    const zSection = document.getElementById('modalZeradoSection');
                    if(isZerado) {
                        zSection.style.display = 'block';
                        document.getElementById('notaZeradoBadge').textContent = notaZ ? `Nota: ${notaZ}/10` : 'Sem nota';
                        document.getElementById('modalOpiniaoZerado').textContent = opiniaoZ ? `"${opiniaoZ}"` : 'Nenhuma opinião registrada.';
                    } else {
                        zSection.style.display = 'none';
                    }

                    const pSection = document.getElementById('modalPlatinaSection');
                    if(isPlatinado) {
                        pSection.style.display = 'block';
                        document.getElementById('notaPlatinaBadge').textContent = notaP ? `Nota: ${notaP}/10` : 'Sem nota';
                        document.getElementById('modalOpiniaoPlatina').textContent = opiniaoP ? `"${opiniaoP}"` : 'Nenhuma opinião registrada.';
                    } else {
                        pSection.style.display = 'none';
                    }

                    gameModal.show();
                });
            });
        });
    </script>
</body>

</html>
