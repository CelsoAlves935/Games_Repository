spring.application.name=game-library

# Ativa o console do H2
spring.h2.console.enabled=true

# Define o caminho para acessar (o padrão já é /h2-console, mas é bom garantir)
spring.h2.console.path=/h2-console

# Configurações do banco de dados em disco
spring.datasource.url=jdbc:h2:file:./data/gamestore;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update